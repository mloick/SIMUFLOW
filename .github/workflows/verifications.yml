name: Vérifications

# À chaque pull request et à chaque push sur main : types (tsc), analyse du
# code (ESLint) et tests (Jest). Une case rouge sur la pull request veut dire
# qu'une de ces vérifications a échoué : il ne faut pas fusionner.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: verifications-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # expo-env.d.ts n'est pas versionné : « npx expo start » le crée en local.
      - name: Types Expo
        run: echo '/// <reference types="expo/types" />' > expo-env.d.ts
      - name: Types (tsc)
        run: npx tsc --noEmit
      - name: Analyse du code (ESLint)
        run: npx expo lint
      - name: Tests (Jest)
        run: npx jest --ci
